version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Kept in lockstep with the Playwright browsers installed in development containers.
      # Upgrade deliberately: bump the version, run `npx playwright install chromium`, run the e2e suite.
      - dependency-name: '@playwright/test'
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
