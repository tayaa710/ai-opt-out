name: Policy watch

# Weekly check of every privacy policy / AI terms page listed in the registry's `policyUrls`.
# When a page's text changes, the report is posted to a "policy-watch" issue for a human to
# review, and the new snapshots are proposed in a pull request. Registry entries are never
# edited automatically.
#
# Optional: add an ANTHROPIC_API_KEY repository secret to include an automated assessment of
# whether each change affects AI training or opt-outs.
# For the snapshot pull request, enable Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests". Without it, the branch is still pushed and the issue says so.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      service:
        description: Only check this service id (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: policy-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the snapshot branch
      issues: write # open or update the report issue
      pull-requests: write # open the snapshot pull request
    env:
      BRANCH: automation/policy-snapshots
      REPORT: policy-watch-report.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needed to push the snapshot branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check policy pages
        id: watch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERVICE: ${{ inputs.service }}
        run: |
          args=(--report "$REPORT")
          if [ -n "$SERVICE" ]; then args+=(--service "$SERVICE"); fi
          node scripts/policy-watch.mjs "${args[@]}"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-watch-report
          path: ${{ env.REPORT }}
          if-no-files-found: ignore
          retention-days: 90

      - name: Propose snapshot updates in a pull request
        id: pr
        if: steps.watch.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add registry/snapshots
          git commit -m "Update policy snapshots ($(date -u +%Y-%m-%d))"
          git push --force origin "$BRANCH"
          existing=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$existing" ]; then
            echo "url=$existing" >> "$GITHUB_OUTPUT"
          elif url=$(gh pr create --head "$BRANCH" --base "$BASE" \
              --title "Update policy snapshots" \
              --body "Updated snapshots from the weekly policy watch. Review the linked policy-watch issue before merging; merging only updates the baselines, it does not change the registry."); then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not open a pull request. Enable 'Allow GitHub Actions to create and approve pull requests', or open one from the $BRANCH branch."
          fi

      - name: Open or update the report issue
        if: steps.watch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ -n "$PR_URL" ]; then
            printf '\nSnapshot pull request: %s\n' "$PR_URL" >> "$REPORT"
          else
            printf '\nNew snapshots were pushed to the `%s` branch.\n' "$BRANCH" >> "$REPORT"
          fi
          gh label create policy-watch --color D93F0B --description "Automated policy change reports" --force
          number=$(gh issue list --label policy-watch --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$REPORT"
          else
            gh issue create --title "Policy changes detected ($(date -u +%Y-%m-%d))" --label policy-watch --body-file "$REPORT"
          fi
